name: Android E2E Test (Maestro + ARM + Debug)

# -----------------------------------------------------------------
# Trigger جديد: هيضيف زرار "Run workflow" في صفحة الـ Actions
# -----------------------------------------------------------------
on:
  workflow_dispatch:

jobs:
  test:
    # 1. بنستخدم أسرع Runner (اللي بيدعم ARM)
    runs-on: ubuntu-latest-arname: Android E2E Test (Maestro + ARM + Debug)

# -----------------------------------------------------------------
# Trigger جديد: هيضيف زرار "Run workflow" في صفحة الـ Actions
# -----------------------------------------------------------------
on:
  workflow_dispatch:

jobs:
  test:
    # 1. بنستخدم أسرع Runner (اللي بيدعم ARM)
    runs-on: ubuntu-latest-arm64

    steps:
      # 2. بنجيب الكود بتاعنا (اللي فيه الـ APK وملفات الـ Maestro)
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. بنجهز الجافا (عشان أدوات الأندرويد زي adb)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # 4. بنسطب Maestro على الـ Runner
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # 5. الخطوة الأساسية: تشغيل الـ Emulator وتنفيذ الخطوات
      - name: Run Android Emulator and Maestro Flow
        # بندي للخطوة دي ID عشان نعرف نستخدمه تحت
        id: run_emulator 
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          # بنستخدم Emulator بمعمارية ARM عشان السرعة
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          
          # الـ Script اللي هيشتغل جوه الـ Action
          script: |
            echo "Emulator is ready! Starting automation..."
            
            # 1. نسطب التطبيق (غير المسار ده لمكان الـ APK بتاعك)
            # مثال: 'app/build/outputs/apk/debug/app-debug.apk'
            adb install app/build/outputs/apk/debug/app-debug.apk
            
            # 2. نشغل الـ Flow بتاع Maestro (غير اسم الملف ده لو مسميه حاجة تانية)
            maestro test maestro-flow.yml
            
            echo "Maestro flow finished."
            
            # 3. نسحب الملف اللي إحنا عايزينه
            echo "Pulling output file from device..."
            # غير المسار ده للمكان اللي التطبيق بيحفظ فيه الملف جوه الـ VM
            # وغير اسم الملف لاسم الملف اللي هيطلع
            adb pull /sdcard/Download/your-output-file.txt .
            
            echo "File pulled successfully."

      # 6. خطوة رفع الملفات (لو الخطوة اللي فاتت نجحت)
      - name: Upload output file
        # هيشتغل بس لو الخطوة اللي الـ ID بتاعها run_emulator نجحت
        if: success() && steps.run_emulator.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: my-automation-output
          # اسم الملف بعد ما سحبناه للـ Runner
          path: your-output-file.txt 

      # 7. خطوة الـ Debugging (لو الخطوة اللي فاتت فشلت)
      - name: Debug via SSH if failed
        # هيشتغل بس لو الخطوة اللي الـ ID بتاعها run_emulator فشلت
        if: failure() && steps.run_emulator.conclusion == 'failure'
        uses: mxschmitt/action-tmate@v3
        with:
          # هيستنى 15 دقيقة قبل ما يقفل الـ SSH
          timeout-minutes: 15
          # بيسمحلك تستخدم sudo جوه الـ SSH
          sudo: true
m64

